name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      selinux_mode:
        description: 'SELinux modu'
        required: true
        default: 'enforcing'
        type: choice
        options:
          - enforcing
          - permissive

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Repo'yu klonla
      uses: actions/checkout@v4
      with:
          fetch-depth: 10
    - name: Gerekli bağımlılıkları yükle
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make \
          python3 python-is-python3 git zip unzip \
          ccache libncurses5-dev libncursesw5-dev \
          clang lld llvm llvm-dev wget curl
    - name: KernelSU-Next Entegre Et
      run: |
        curl -LSs "https://raw.githubusercontent.com/keremkt38/KernelSU/fork/kernel/setup.sh" | bash
    - name: SELinux modunu ayarla
      env:
        SELINUX_MODE: ${{ inputs.selinux_mode }}
      run: |
        DEFCONFIG=arch/arm64/configs/exynos9611-m30s_defconfig
        if [ "$SELINUX_MODE" = "permissive" ]; then
          sed -i 's/^# CONFIG_ALWAYS_PERMIT is not set/CONFIG_ALWAYS_PERMIT=y/' "$DEFCONFIG"
          grep -q '^CONFIG_ALWAYS_PERMIT=y' "$DEFCONFIG" || echo 'CONFIG_ALWAYS_PERMIT=y' >> "$DEFCONFIG"
        fi
        grep -n 'ALWAYS_PERMIT' "$DEFCONFIG"
    - name: Kernel build et
      run: |
        
        chmod +x build.sh
        ./build.sh

    - name: AnyKernel3 indir ve paketle
      run: |
        git clone https://github.com/keremkt38/AnyKernel3.git
        
        OUT_NAME="Argaeus_m30s_${{ github.run_number }}_${{ inputs.selinux_mode }}"

        # Kernel image kopyala
        cp AK3/Image AnyKernel3/
        cp AK3/dtb.img AnyKernel3/
        cd AnyKernel3
        zip -r "${OUT_NAME}.zip" ./*
        cd ..

    

    - name: Telegram'a gönder
      run: |
        FILE="AnyKernel3/Argaeus_m30s_${{ github.run_number }}_${{ inputs.selinux_mode }}.zip"

        curl -F document=@"$FILE" \
             -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
             https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
